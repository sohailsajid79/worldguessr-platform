- name: Download Microsoft signing key
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /etc/apt/keyrings/microsoft.asc
    mode: "0644"

- name: Add Azure CLI apt repository
  ansible.builtin.apt_repository:
    # Pinned to bookworm: the Pi runs trixie Debian, and Microsoft hasn't published
    # a trixie index for this repo yet.
    repo: >-
      deb [arch=arm64 signed-by=/etc/apt/keyrings/microsoft.asc]
      https://packages.microsoft.com/repos/azure-cli/ bookworm main
    filename: azure-cli
    state: present

- name: Install Azure CLI
  ansible.builtin.apt:
    name: azure-cli
    state: present
    update_cache: true